# Build and publish the dchat-relay container image to GitHub Container Registry:
#   ghcr.io/<owner>/dchat-relay:latest (and :sha-<commit>)
# Runs when the relay or the shared protocol code changes on main, or by hand.
name: Publish relay image

on:
  push:
    branches: [main]
    paths:
      - "crates/relay/**"
      - "crates/protocol/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Relay and protocol tests
        run: cargo test --locked -p relay -p protocol

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dchat-relay
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

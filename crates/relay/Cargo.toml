[package]
name = "relay"
version = "0.1.0"
edition = "2021"
description = "dchat-relay: a minimal, RAM-only Nostr relay for dchat signaling"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dchat-relay"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"

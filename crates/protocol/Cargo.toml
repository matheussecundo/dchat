[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
base64 = "0.23"
rand = "0.10"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
k256 = { version = "0.14", default-features = false, features = ["schnorr", "arithmetic", "alloc"] }
sha2 = "0.11"
hex = "0.4"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hmac = "0.13"


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
